<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Hole City invite</title>
<meta name="description" content="A friend invited you to Hole City. Come raid their city!">
<!-- Link previews (WhatsApp, Messages, Telegram) read these; crawlers do not run scripts. -->
<meta property="og:type" content="website">
<meta property="og:site_name" content="Hole City">
<meta property="og:title" content="Come raid my city in Hole City!">
<meta property="og:description" content="Tap to become friends and raid each other's cities.">
<!-- Optional: a 1200x630 picture makes the preview card a picture. og:image has to be absolute,
     so whoever uncomments it writes the host serving this page and no other.
<meta property="og:image" content="https://oisifgames.com/hole/og.png"> -->
<!-- iOS Safari banner that opens the app or the App Store; fill the App Store id, then uncomment.
<meta name="apple-itunes-app" content="app-id=APP_STORE_ID"> -->
<meta name="robots" content="noindex">
<meta name="theme-color" content="#b3ccbd">
<link rel="preload" href="/hole/assets/fonts/barlow-condensed-black.woff2" as="font" type="font/woff2" crossorigin>
<style>
/* The game's look, ported. Every token below is Assets/Oisif/Content/UI/Toolkit/theme.uss, the
 * one source of colour, type, shape and depth in Hole City, converted from its 1080-unit
 * reference frame to this page's 420px column: 1 unit = 0.389 px. The game unit is in the
 * comment beside each value, so a theme change here is a lookup rather than a guess.
 * The game has one look and no dark scheme, so this page has none either. */
@font-face {
  font-family: 'HC Display';          /* --hc-font-display: BarlowCondensed-Black */
  src: url('/hole/assets/fonts/barlow-condensed-black.woff2') format('woff2');
  font-weight: 900; font-style: normal; font-display: swap;
}
@font-face {
  font-family: 'HC Body';             /* --hc-font-body: Nunito SemiBold */
  src: url('/hole/assets/fonts/nunito-semibold.woff2') format('woff2');
  font-weight: 600; font-style: normal; font-display: swap;
}

:root {
  /* Ink */
  --ink: #161f35;                     /* --hc-ink */
  --ink-dim: #404e68;                 /* --hc-ink-dim */
  --ink-faint: #626e84;               /* --hc-ink-faint */
  /* Paper */
  --surface: #fbf8ed;                 /* --hc-surface, the cream card */
  --surface-2: #f2ecda;               /* --hc-surface-2, a pressed face */
  --surface-3: #e2dbc6;               /* --hc-surface-3, hairline */
  /* The ground. The game draws its world here; every UI capture the project takes stands it in
   * with this sage (Editor/UiGateShots.cs colorClearValue 0.70 0.80 0.74), so it is what the
   * cream cards are designed to sit on. */
  --ground: #b3ccbd;
  /* Accents */
  --lime: #d0f262;                    /* --hc-lime, the PLAY green */
  --lime-pressed: #bcde50;            /* --hc-lime-tint-pressed */
  --gold: #ffd666;                    /* --hc-gold */

  /* Shape, 1080 units in the comment */
  --radius-m: 13px;                   /* --hc-radius-m 32: row, button */
  --radius-l: 16px;                   /* --hc-radius-l 40: card */
  --control: 60px;                    /* --hc-control-height 154 */
  --pad: 16px;                        /* --hc-pad 42 */
  --sp-1: 3px;                        /* --hc-space-1 8 */
  --sp-2: 6px;                        /* --hc-space-2 16 */
  --sp-3: 9px;                        /* --hc-space-3 24 */
  --sp-4: 16px;                       /* --hc-space-4 42 */
  --sp-5: 25px;                       /* --hc-space-5 64 */

  /* Depth: the hatched cast shadow, offset down and right of the face. */
  --shadow-x: 2.5px;                  /* --hc-shadow-x 7 */
  --shadow-y: 5.5px;                  /* --hc-shadow-offset 15 */
  /* The drawn outline. In the game it is one device pixel whatever the screen: a 1080-wide
     render of a 390pt screen puts it at 1 px, which is 0.36 CSS px. A browser snaps any border
     under 1 CSS px up to a whole one, so the width cannot be matched and the ink is matched
     instead: a 1 px border at the alpha that leaves about the same amount of dark on the edge.
     Measured off the same capture, that edge is near-black on cream and an olive blend on the
     lime, which is why the accent carries its own. */
  --edge: 1px;
  --edge-ink: rgba(22, 31, 53, .45);
  --edge-ink-accent: rgba(22, 31, 53, .3);

  /* Motion */
  --t-press: 90ms;                    /* --hc-t-press */
}

* { box-sizing: border-box; }
html { -webkit-text-size-adjust: 100%; }
body {
  margin: 0; background: var(--ground); color: var(--ink);
  font: 600 17px/1.4 'HC Body', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
  -webkit-font-smoothing: antialiased;
  min-height: 100vh; display: flex; align-items: center; justify-content: center;
  padding: max(var(--sp-5), env(safe-area-inset-top)) var(--sp-4) max(var(--sp-5), env(safe-area-inset-bottom));
}
main { width: 100%; max-width: 420px; }

/* Display type: the game sets its condensed face on titles, CTAs and tabs, always caps,
 * always on the ink colour, never white on an accent (--hc-ink-on-accent). */
.display {
  font-family: 'HC Display', 'Arial Narrow', Impact, sans-serif;
  font-weight: 900; text-transform: uppercase; letter-spacing: 0.01em;
}

/* ── The screen header: the game's mark and name, the way a screen names itself ── */
.head { display: flex; align-items: center; gap: var(--sp-3); margin: 0 0 var(--sp-4) var(--sp-1); }
.head svg { width: 42px; height: 42px; display: block; flex: none; }
.head .name { font-size: 26px; line-height: 1; margin: 0; }  /* --hc-fs-home-name 68 */

/* ── The pressable: a cream face over a hatched cast shadow. Pressing moves the face down
      onto the shadow by exactly the shadow offset, which is what the game does. ──────── */
.press {
  position: relative; display: block; width: 100%; min-height: var(--control);
  margin: 0 0 calc(var(--shadow-y) + var(--sp-3));
  border: 0; padding: 0; background: none; cursor: pointer;
  color: inherit; text-decoration: none; font: inherit;
  -webkit-tap-highlight-color: transparent;
}
/* The cast shadow is a drawn contour offset down and right, with a fringe of hatch ticks along
   its bottom edge. It has no fill: the ground shows through the crescent, which is what the
   UiHatch material draws in the game. */
.press::before {
  content: ''; position: absolute; inset: 0;
  transform: translate(var(--shadow-x), var(--shadow-y));
  border: var(--edge) solid var(--edge-ink); border-radius: var(--radius-m);
  background-image: repeating-linear-gradient(72deg,
    rgba(22,31,53,.6) 0 .5px, transparent .5px 3.5px);
  background-size: 100% 4px; background-position: left bottom; background-repeat: repeat-x;
}
.press .face {
  position: relative; display: flex; align-items: center; justify-content: center;
  gap: var(--sp-2); min-height: var(--control); padding: var(--sp-3) var(--sp-4);
  background: var(--surface); color: var(--ink);
  border: var(--edge) solid var(--edge-ink); border-radius: var(--radius-m);
  transition: transform var(--t-press) ease-out;
}
.press:active .face { transform: translate(var(--shadow-x), var(--shadow-y)); background: var(--surface-2); }
.press:active::before { opacity: 0; }
.press.primary::before { border-radius: var(--radius-l); }
.press:focus-visible .face { outline: 3px solid var(--ink); outline-offset: 3px; }

/* The primary commit is the PLAY green, and its type is ink, never white. */
.press.primary .face { background: var(--lime); border-color: var(--edge-ink-accent);
  border-radius: var(--radius-l); font-size: 25px; }    /* --hc-fs-cta 64, the card radius: a commit is a face, not a row */
.press.primary:active .face { background: var(--lime-pressed); }

/* Secondary pressables sit in a row and carry the smaller CTA size. */
.press.small .face { min-height: 47px; font-size: 19px; padding: var(--sp-2) var(--sp-3); }  /* --hc-tap-min 120, --hc-fs-label 50 */
.press.small { min-height: 47px; }
.row { display: flex; gap: var(--sp-3); }
.row .press { flex: 1; }
.press[aria-disabled="true"] { pointer-events: none; }
.press[aria-disabled="true"] .face { color: var(--ink-faint); background: var(--surface-2); }
.press[aria-disabled="true"]::before { display: none; }

/* A ghost pressable: the game's --hc-btn--ghost, no face fill, outline only, no shadow,
   because it is the quiet option. */
.press.ghost { margin-bottom: 0; }
.press.ghost::before { display: none; }
.press.ghost .face {
  background: transparent; border-color: var(--ink-faint); color: var(--ink-dim);
  min-height: 47px; font-size: 19px;
}
.press.ghost:active .face { background: rgba(22,31,53,.06); transform: none; }  /* --hc-ink-wash */

/* ── Cards. Fc's rule, from Look/look.uss: a card that only shows facts casts no shadow;
      only something you can tap does. So this one is outlined and flat, and the buttons
      inside it carry the depth. ──────────────────────────────────────────────────────── */
.card {
  background: var(--surface); border: var(--edge) solid var(--edge-ink); border-radius: var(--radius-l);
  padding: var(--pad); margin: 0 0 var(--sp-4);
}
.card > :last-child { margin-bottom: 0; }
.card .title { font-size: 19px; margin: 0 0 var(--sp-3); }   /* --hc-fs-label 50 */

h1 { font-size: 30px; line-height: 1.05; margin: 0 0 var(--sp-3); }  /* --hc-fs-screen-title 76 */
.lead { font-size: 17px; color: var(--ink-dim); margin: 0 0 var(--sp-4); }  /* --hc-fs-body 44 */
.note { font-size: 15px; color: var(--ink-faint); margin: var(--sp-3) 0 0; }  /* --hc-fs-caption 40 */
.hidden { display: none; }
</style>
</head>
<body>
<main>
  <div class="head">
    <!-- A hole in a patch of ground, in the slot the game's own header keeps for the city
         thumbnail. Drawn rather than set as the 🕳️ emoji the share message carries: at this
         size the system emoji is another vendor's artwork, in another vendor's palette. -->
    <svg viewBox="0 0 48 48" aria-hidden="true" focusable="false">
      <rect x="1.4" y="1.4" width="45.2" height="45.2" rx="11" fill="#fbf8ed" stroke="#161f35" stroke-opacity=".45" stroke-width="2.2"/>
      <ellipse cx="24" cy="27" rx="14" ry="9.5" fill="#161f35"/>
    </svg>
    <p class="display name">Hole City</p>
  </div>

  <h1 class="display" id="title">Come raid my city</h1>
  <p class="lead" id="lead">A friend invited you. Open the game to become friends.</p>

  <a class="press primary" id="open" href="#"><span class="display face">Open Hole City</span></a>

  <section class="card" id="getit">
    <p class="title">New here? It&rsquo;s free.</p>
    <div class="row">
      <a class="press small" id="android" href="#"><span class="display face">Google Play</span></a>
      <a class="press small" id="ios" href="#"><span class="display face">iPhone soon</span></a>
    </div>
    <p class="note" id="after">Install it, then tap this link again.</p>
    <p class="note hidden" id="testing">Hole City is in closed testing. Ask your friend to get you in.</p>
  </section>

  <button class="press ghost" id="copy" type="button"><span class="display face">Copy the link</span></button>

</main>
<script>
(function () {
  // Fill when the stores have the game; an empty value greys the button out.
  var APP_STORE_ID = "";                  // 6736468492, deliberately unused: the live iOS build (0.1.3) predates friend links and cannot take an invite.
  var PACKAGE = "com.OisifGames.Hole";
  // Where a player without the game is sent. This page addresses no host but the one serving it
  // and the stores, which is deliberate and not to be relaxed. Fill with the Play testing opt-in URL
  // (https://play.google.com/apps/testing/com.OisifGames.Hole) once the closed track has testers,
  // or the listing once it is reinstated. Empty greys the button and shows the testing line.
  var INSTALL_URL = "";
  var IOS_URL = APP_STORE_ID ? "https://apps.apple.com/app/id" + APP_STORE_ID : "";

  // The inviter's code (a UGS player id), in either shared form: /hole/f/<code> here, or
  // /hole/f/?c=<code> on oisifgames.com, where a static host cannot rewrite a path to a page.
  // Anything else is refused.
  var m = location.pathname.match(/^\/hole\/f\/([A-Za-z0-9_-]{1,64})\/?$/);
  var code = m ? m[1] : "";
  if (!code) {
    var q = /[?&]c=([^&#]*)/.exec(location.search || "");
    try { code = q ? decodeURIComponent(q[1]) : ""; } catch (e) { code = ""; }
    if (!/^[A-Za-z0-9_-]{1,64}$/.test(code)) code = "";
  }
  // Invites shared before the move point at the old host, and nothing can retract them. Any host
  // but the canonical one hands the visitor straight over, so only one domain ever renders this
  // page to a player. Inert on the canonical host, which is why both copies of this file are the
  // same bytes.
  var CANONICAL_HOST = "oisifgames.com";
  if (code && location.hostname !== CANONICAL_HOST && location.hostname !== "www." + CANONICAL_HOST) {
    location.replace("https://" + CANONICAL_HOST + "/hole/f/?c=" + encodeURIComponent(code));
    return;
  }

  // The link to hand back, rebuilt on whatever host served this page and in the form it arrived
  // in, so no domain is hardcoded and the copy always matches what the friend shared.
  var link = location.origin + (m ? "/hole/f/" + code : "/hole/f/?c=" + encodeURIComponent(code));
  var ua = navigator.userAgent || "";
  var isAndroid = /Android/i.test(ua);
  var isIOS = /iPhone|iPad|iPod/i.test(ua) || (navigator.platform === "MacIntel" && navigator.maxTouchPoints > 1);

  var open = document.getElementById("open");
  var ios = document.getElementById("ios");
  var android = document.getElementById("android");
  var copy = document.getElementById("copy");

  function show(id, on) { document.getElementById(id).classList[on ? "remove" : "add"]("hidden"); }

  if (!code) {
    // No readable code: the headline becomes the problem, rather than a notice under a dead
    // button. The store card stays, because installing the game is still worth doing.
    open.classList.add("hidden");
    copy.classList.add("hidden");
    document.getElementById("title").textContent = "This invite is broken";
    document.getElementById("lead").textContent = "Ask your friend to send the link again.";
    document.getElementById("after").classList.add("hidden");
  } else if (isAndroid) {
    // Opens the app through its oisifhole intent filter. No browser fallback while INSTALL_URL is
    // empty: Android then just stays on this page, which is the intended behaviour.
    open.href = "intent://friend/" + code + "#Intent;scheme=oisifhole;package=" + PACKAGE +
      (INSTALL_URL ? ";S.browser_fallback_url=" + encodeURIComponent(INSTALL_URL) : "") + ";end";
  } else {
    // iOS: Safari asks to open the app. Not tried automatically: without the app it shows an error.
    open.href = "oisifhole://friend/" + code;
  }

  if (INSTALL_URL) android.href = INSTALL_URL;
  else { android.setAttribute("aria-disabled", "true"); show("testing", true); show("after", false); }
  if (IOS_URL) ios.href = IOS_URL; else ios.setAttribute("aria-disabled", "true");
  if (isIOS) android.parentNode.appendChild(android); // own platform first
  if (isAndroid) ios.parentNode.appendChild(ios);

  copy.addEventListener("click", function () {
    var label = copy.querySelector(".face");
    // "link copied" is what the game's own share button says once it has copied (HoleCityRouter).
    function done() { label.textContent = "Link copied"; }
    if (navigator.clipboard && navigator.clipboard.writeText) navigator.clipboard.writeText(link).then(done, done);
    else { var t = document.createElement("textarea"); t.value = link; document.body.appendChild(t); t.select();
      try { document.execCommand("copy"); } catch (e) {} document.body.removeChild(t); done(); }
  });
})();
</script>
</body>
</html>
